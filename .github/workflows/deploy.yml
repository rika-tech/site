name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run build
        env:
          NITRO_PRESET: github-pages

      - name: Configure Pages artifact and 404 fallback
        run: |
          if [ -d ".output/public" ]; then
            OUT_DIR=".output/public"
          elif [ -d "dist" ]; then
            OUT_DIR="dist"
          else
            OUT_DIR="."
          fi
          echo "Using output directory: $OUT_DIR"
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV
          touch "$OUT_DIR/.nojekyll"
          if [ -f "$OUT_DIR/index.html" ] && [ ! -f "$OUT_DIR/404.html" ]; then
            cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
